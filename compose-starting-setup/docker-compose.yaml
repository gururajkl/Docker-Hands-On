version: "3.8"

services:
  mongodb:
    image: 'mongo'
    volumes:
      - "data:/data/db"
    # environment:
      # This is an example of how to use an env to set the environment variables for the MongoDB container.
      # MONGO_INITDB_ROOT_USERNAME: max
      # MONGO_INITDB_ROOT_PASSWORD: secret
    env_file:
      - ./env/mongo.env

volumes:
  # This is the syntax docker expects for creating a named volume.
  # Just a name with colon is enough docker will use this volume.
  data: